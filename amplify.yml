version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
# Security response headers live in customHttp.yml (repo root) — AWS recommends keeping them
# out of the build spec / amplify.yml. Wave 2 adds a Content-Security-Policy there.
